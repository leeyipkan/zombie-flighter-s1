<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>屍潮餘燼 · DEAD BLOCK</title>
<style>
:root{
  --bg:#08090b; --panel:#121519; --panel2:#0e1114; --line:#262b32; --line2:#323842;
  --text:#ddd8cc; --dim:#8d8f95; --amber:#e0a13c; --green:#83c46c; --red:#d96655;
  --blue:#6f9fd0; --teal:#5fb1b0;
}
*{box-sizing:border-box;margin:0;padding:0;}
*{transition:none!important;animation:none!important;}
html,body{height:100%;}
body{
  background:radial-gradient(1100px 700px at 35% -10%,#181c21 0%,#0a0c0f 55%,#08090b 100%);
  color:var(--text);
  font:14px/1.45 "Segoe UI","Microsoft JhengHei","Microsoft YaHei","PingFang TC",system-ui,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex;flex-direction:column;height:100vh;min-height:560px;}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,23,27,.92),rgba(10,12,15,.55));
  flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:12px;}
.logo{font-size:21px;color:var(--green);width:38px;height:38px;display:grid;place-items:center;
  border:1px solid #3a4a3a;background:#111a13;border-radius:4px;}
h1{font-size:17px;letter-spacing:.14em;font-weight:700;}
.brand p{font-size:9.5px;letter-spacing:.3em;color:var(--dim);margin-top:1px;}
.topmeta{display:flex;align-items:center;gap:8px;}
.pill{font-size:12px;color:var(--dim);border:1px solid var(--line);background:var(--panel2);
  padding:4px 10px;border-radius:3px;letter-spacing:.05em;white-space:nowrap;}
.pill b{color:var(--amber);font-family:Consolas,monospace;}
.iconbtn{width:30px;height:30px;border-radius:3px;border:1px solid var(--line);background:var(--panel2);
  color:var(--dim);font-size:14px;cursor:pointer;font-family:inherit;}
.iconbtn:hover{color:var(--amber);border-color:#4a4128;}
.iconbtn.off{opacity:.35;}
main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:14px;padding:12px 16px 14px;}
#stage{min-width:0;display:flex;flex-direction:column;gap:8px;align-items:center;}
#canvasWrap{width:100%;max-width:1056px;border:1px solid var(--line2);border-radius:5px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.55);background:#101215;}
canvas{display:block;width:100%;height:auto;cursor:crosshair;}
#hintbar{width:100%;max-width:1056px;min-height:31px;display:flex;align-items:center;gap:9px;
  padding:5px 12px;border:1px solid var(--line);background:var(--panel2);border-radius:4px;
  font-size:12.5px;color:#c8c3b7;}
#hintbar .dot{width:7px;height:7px;background:var(--amber);border-radius:50%;flex:0 0 auto;}
#hintbar.alert{border-color:#5a2a24;background:#1a0f0e;}
#hintbar.alert .dot{background:var(--red);}
#side{min-height:0;overflow-y:auto;padding-right:3px;}
#side::-webkit-scrollbar{width:8px;}
#side::-webkit-scrollbar-thumb{background:#2c3138;border-radius:4px;}
#side::-webkit-scrollbar-track{background:transparent;}
.panel{background:linear-gradient(180deg,#14171b,#101215);border:1px solid var(--line);
  border-radius:6px;padding:8px 10px;margin-bottom:7px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;
  letter-spacing:.2em;color:#c79a4e;margin-bottom:8px;text-transform:uppercase;}
.dim{color:var(--dim);letter-spacing:.06em;font-size:11px;text-transform:none;}
.hprow{display:flex;align-items:center;gap:8px;}
.bar{display:block;height:9px;background:#1b1e23;border:1px solid #2c3138;border-radius:2px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--green);width:100%;}
.bar.hp{flex:1;}
.hpnum{font-family:Consolas,monospace;font-size:12px;color:#c8c3b7;white-space:nowrap;}
.gear{margin-top:9px;display:flex;flex-direction:column;gap:5px;}
.gear-row{display:grid;grid-template-columns:32px 1fr auto;gap:4px 7px;align-items:center;font-size:12px;}
.gear-k{color:var(--dim);font-size:11px;}
.gear-n{color:#e6e1d4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gear-s{font-family:Consolas,monospace;color:var(--amber);font-size:11px;}
.gear-row .bar{grid-column:1 / -1;height:4px;margin-top:-1px;}
.bar i.dur{background:#8a9aa8;}
ul.obj{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12.4px;}
ul.obj li{display:flex;gap:7px;color:#a9a49a;line-height:1.35;}
ul.obj li .mk{color:#4a4f57;flex:0 0 auto;font-family:Consolas,monospace;}
ul.obj li.done{color:#7f9a72;text-decoration:line-through;text-decoration-color:#3f5540;}
ul.obj li.done .mk{color:var(--green);}
ul.obj li.active{color:#e0b25a;}
ul.obj li.active .mk{color:var(--amber);}
.partsline{margin-top:9px;padding-top:8px;border-top:1px dashed #262b32;font-size:11.5px;color:var(--dim);
  display:flex;flex-wrap:wrap;gap:3px 9px;}
.partsline b{font-family:Consolas,monospace;color:#c8c3b7;font-weight:600;}
.partsline .ok{color:var(--green);}
.partsline .no{color:#6d5a5a;}
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.slot{position:relative;aspect-ratio:1/1;background:#161a1e;border:1px solid #2a2f36;border-radius:4px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
.slot:hover{border-color:#6a5830;background:#1a1e23;}
.slot.empty{background:#0f1215;border-style:dashed;border-color:#1e232a;cursor:default;}
.slot .g{font-size:17px;font-weight:700;line-height:1;}
.slot .cnt{position:absolute;right:3px;bottom:1px;font-size:10px;color:#cfc9bb;font-family:Consolas,monospace;}
.slot .x{position:absolute;left:2px;top:1px;font-size:10px;color:#6c625a;padding:1px 2px;line-height:1;}
.slot .x:hover{color:var(--red);}
.slot .durbar{position:absolute;left:3px;right:3px;bottom:2px;height:2px;background:#242a30;}
.slot .durbar b{display:block;height:100%;background:#8a9aa8;}
.tip{font-size:10.5px;color:#6f7278;margin-top:7px;letter-spacing:.03em;}
ul.log{list-style:none;max-height:146px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;
  font-size:12px;line-height:1.45;}
ul.log li{color:#b4afa3;}
ul.log li .tn{color:#5c6068;font-family:Consolas,monospace;font-size:10px;margin-right:5px;}
.k-good{color:#8fce74!important;} .k-bad{color:#e07a68!important;}
.k-warn{color:#e0b25a!important;} .k-sys{color:#87aecb!important;} .k-info{color:#b4afa3!important;}
.keys .keyrow{display:flex;align-items:center;gap:5px;font-size:11.5px;color:#a9a49a;margin-bottom:5px;}
.keys .keyrow:last-child{margin-bottom:0;}
kbd{font-family:Consolas,monospace;font-size:10.5px;background:#191d22;border:1px solid #333941;
  border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:#d5d0c4;min-width:19px;text-align:center;}
.keys .keyrow span{margin-left:3px;}
#modal{position:fixed;inset:0;background:rgba(4,5,7,.84);display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:50;}
#modal.hidden{display:none;}
.modal-card{width:min(840px,100%);max-height:88vh;overflow-y:auto;background:#111418;
  border:1px solid #30363e;border-radius:8px;padding:22px 24px;box-shadow:0 26px 70px rgba(0,0,0,.7);}
.modal-card::-webkit-scrollbar{width:9px;}
.modal-card::-webkit-scrollbar-thumb{background:#2c3138;border-radius:4px;}
.mc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px;}
.mc-head h2{font-size:19px;letter-spacing:.1em;}
.mc-head p{font-size:12px;color:var(--dim);margin-top:3px;}
.mc-x{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:3px;
  width:28px;height:28px;cursor:pointer;font-size:14px;flex:0 0 auto;font-family:inherit;}
.mc-x:hover{color:var(--red);border-color:#5a2a24;}
.btn{font-family:inherit;cursor:pointer;border-radius:4px;padding:8px 18px;font-size:13px;
  background:#1b2026;color:#ded9cc;border:1px solid #3a414a;letter-spacing:.06em;}
.btn:hover{background:#232a31;border-color:#5a6470;}
.btn.primary{background:#e0a13c;border-color:#e0a13c;color:#17130a;font-weight:700;}
.btn.primary:hover{background:#f0af48;border-color:#f0af48;}
.btn.danger{background:#5a201a;border-color:#8a342a;color:#f0c0b8;}
.btn.danger:hover{background:#6d261e;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.hero{display:flex;align-items:center;gap:16px;margin:6px 0 16px;}
.hero .big{font-size:44px;color:var(--green);}
.hero h2{font-size:26px;letter-spacing:.16em;}
.hero p{color:var(--dim);letter-spacing:.12em;font-size:11px;}
.story{font-size:13px;line-height:1.8;color:#c3beb2;margin-bottom:16px;}
.story b{color:var(--amber);}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.mcol{border:1px solid var(--line);background:#0e1114;border-radius:5px;padding:11px 13px;}
.mcol h3{font-size:11px;letter-spacing:.2em;color:#c79a4e;margin-bottom:7px;text-transform:uppercase;}
.mcol p{font-size:12px;color:#b0ab9f;line-height:1.6;}
.mcol b{color:#e6e1d4;}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
.savebox{display:flex;align-items:center;justify-content:space-between;gap:14px;
  border:1px solid #4a4128;background:#1a1710;border-radius:6px;padding:10px 12px;margin:0 0 12px;}
.saveinfo{font-size:12.5px;color:#d8c9a8;line-height:1.5;}
.saveinfo b{color:#e0a13c;}
.namebox{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap;}
.namebox label{font-size:12px;color:var(--dim);letter-spacing:.1em;}
.namebox input{background:#0e1114;border:1px solid #3a414a;color:#e6e1d4;border-radius:4px;
  padding:7px 10px;font-size:14px;font-family:inherit;width:150px;outline:none;}
.namebox input:focus{border-color:var(--amber);}
.savehint{font-size:11px;color:#6f7278;}
.stashgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px;margin:12px 0;align-items:start;}
.stash-panel{border:1px solid #262b32;background:#0e1114;border-radius:5px;padding:9px 10px;}
.stash-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.14em;color:#c79a4e;margin-bottom:8px;}
.stash-slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.stash-slots.wide{grid-template-columns:repeat(8,1fr);}
.stash-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;}
.stash-tools .btn{padding:6px 12px;font-size:12px;}
.stash-tools .savehint{margin-left:auto;}
.recipes{display:flex;flex-direction:column;gap:6px;}
.rgroup{font-size:10px;letter-spacing:.2em;color:#c79a4e;margin:8px 0 1px;text-transform:uppercase;}
.rgroup:first-child{margin-top:2px;}
.recipe{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;
  border:1px solid #242a31;background:#0e1115;border-radius:5px;padding:7px 10px;}
.recipe.locked{opacity:.55;}
.r-icon{width:34px;height:34px;border:1px solid #2c333b;border-radius:4px;display:grid;place-items:center;
  font-size:18px;font-weight:700;background:#14181c;}
.r-name{font-size:13px;color:#e6e1d4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.r-name .tag{font-family:Consolas,monospace;font-size:10px;color:var(--amber);border:1px solid #4a4128;
  background:#1a1710;border-radius:2px;padding:0 5px;letter-spacing:.02em;}
.r-cost{font-size:11px;color:#8d8f95;margin-top:2px;}
.r-cost .c-ok{color:#8fce74;} .r-cost .c-no{color:#d96655;}
.r-desc{font-size:10.5px;color:#6f7278;margin-top:1px;}
.r-btn{min-width:70px;padding:6px 12px;font-size:12px;}
.hr{border:0;border-top:1px solid var(--line);margin:16px 0;}
.warnbox{border:1px solid #5a2a24;background:#1b100e;border-radius:5px;padding:11px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;}
.warnbox p{font-size:12px;color:#d8a9a1;line-height:1.5;}
.badge{font-family:Consolas,monospace;font-size:10.5px;border:1px solid #3a414a;color:#8d8f95;
  border-radius:2px;padding:0 5px;}
.over{text-align:center;padding:8px 0 4px;}
.over .big{font-size:52px;line-height:1.1;margin-bottom:8px;}
.over h2{font-size:24px;letter-spacing:.2em;margin-bottom:6px;}
.over p{color:var(--dim);font-size:13px;margin-bottom:14px;}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px;}
.stat{border:1px solid var(--line);background:#0e1114;border-radius:5px;padding:10px;}
.stat b{display:block;font-family:Consolas,monospace;font-size:19px;color:var(--amber);}
.stat span{font-size:11px;color:var(--dim);letter-spacing:.08em;}
@media (max-width:1180px){
  main{grid-template-columns:minmax(0,1fr) 300px;}
  #side{max-height:calc(100vh - 86px);}
}
@media (max-width:960px){
  body{overflow:auto;}
  main{grid-template-columns:1fr;overflow:visible;}
  #stage{order:1;} #side{order:2;max-height:none;}
  .mcols{grid-template-columns:1fr;}
  .stashgrid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="logo">☣</span>
      <div><h1>屍潮餘燼</h1><p>DEAD BLOCK · 近戰生存</p></div>
    </div>
    <div class="topmeta">
      <div class="pill">第 <b id="turnLabel">0</b> 回合</div>
      <div class="pill" id="phaseLabel">搜刮階段</div>
      <button class="iconbtn" id="saveBtn" title="保存進度">存</button>
      <button class="iconbtn" id="helpBtn" title="玩法說明">?</button>
      <button class="iconbtn" id="musicBtn" title="背景音樂">♫</button>
      <button class="iconbtn" id="muteBtn" title="音效開關">♪</button>
    </div>
  </header>
  <main>
    <section id="stage">
      <div id="canvasWrap"><canvas id="game" width="1056" height="600" tabindex="0"></canvas></div>
      <div id="hintbar"><span class="dot"></span><span id="hintText">正在載入…</span></div>
    </section>
    <aside id="side">
      <section class="panel">
        <div class="panel-head"><span id="charName">倖存者 · 阿鐵</span><span class="dim" id="posLabel">—</span></div>
        <div class="hprow">
          <span class="bar hp"><i id="hpFill"></i></span>
          <span class="hpnum" id="hpText">100 / 100</span>
        </div>
        <div class="gear">
          <div class="gear-row">
            <span class="gear-k">武器</span>
            <span class="gear-n" id="weaponName">木棒</span>
            <span class="gear-s" id="weaponStat">ATK 5</span>
            <span class="bar"><i id="weaponDur"></i></span>
          </div>
          <div class="gear-row">
            <span class="gear-k">護甲</span>
            <span class="gear-n" id="armorName">無</span>
            <span class="gear-s" id="armorStat">DEF 0</span>
            <span class="bar"><i id="armorDur"></i></span>
          </div>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><span>生存目標</span></div>
        <ul id="objList" class="obj"></ul>
        <div class="partsline" id="partsLine"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><span>背包</span><span class="dim" id="bagCount">0 / 12</span></div>
        <div id="bagGrid" class="bag"></div>
        <div class="tip">點擊物品：食用 / 裝備 · 右上角 ×：丟棄</div>
      </section>
      <section class="panel">
        <div class="panel-head"><span>日誌</span><span class="dim" id="logTurn"></span></div>
        <ul id="logList" class="log"></ul>
      </section>
    </aside>
  </main>
</div>
<div id="modal" class="hidden"></div>

<script>
(() => {
'use strict';

/* =========================================================================
   0. 基礎常量與工具
   ========================================================================= */
const TILE = 24, W = 64, H = 40;
const VIEW_W = 44 * TILE, VIEW_H = 25 * TILE;   // 視窗 1056x600；地圖 1536x960
const CAP = 12;
const STASH_CAPS = [24, 36, 48];
const STASH_UPGRADES = [null,
  { wood:4, scrap:3, tape:2 },
  { scrap:6, wood:4, tape:3 },
];
const HOLDOUT_TURNS = 10;

const T = { STREET:0, SIDEWALK:1, GRASS:2, FLOOR:3, WALL:4, DOOR:5, BARRICADE:6 };
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]];

const $ = (id) => document.getElementById(id);
const canvas = $('game');
const ctx = canvas.getContext('2d');
const DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
canvas.width = VIEW_W * DPR;
canvas.height = VIEW_H * DPR;

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd = (n) => Math.floor(Math.random() * n);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function hash2(x,y){
  let h = (x|0) * 374761393 + (y|0) * 668265263;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function seeded(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rr(x,y,w,h,r){
  const rad = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rad,y);
  ctx.arcTo(x+w,y,x+w,y+h,rad);
  ctx.arcTo(x+w,y+h,x,y+h,rad);
  ctx.arcTo(x,y+h,x,y,rad);
  ctx.arcTo(x,y,x+w,y,rad);
  ctx.closePath();
}

/* =========================================================================
   1. 數據：物品 / 喪屍 / 配方 / 掉落
   ========================================================================= */
const ITEM = {
  /* ---- 零件 ---- */
  scrap:   { name:'廢鐵',   glyph:'鐵', color:'#9aa3ad', type:'mat', desc:'生鏽的金屬碎片。武器與護甲的基礎。' },
  wood:    { name:'木板',   glyph:'木', color:'#b98a55', type:'mat', desc:'從傢俱上拆下來的木板。' },
  cloth:   { name:'布條',   glyph:'布', color:'#c2b7a0', type:'mat', desc:'從窗簾或衣物撕下的布條。' },
  wire:    { name:'電線',   glyph:'線', color:'#c9a227', type:'mat', desc:'還帶著一點銅芯的電線。' },
  tape:    { name:'膠帶',   glyph:'膠', color:'#8f9aa3', type:'mat', desc:'萬能膠帶，什麼都粘得住。' },
  bottle:  { name:'玻璃瓶', glyph:'瓶', color:'#6fa8a5', type:'mat', desc:'空玻璃瓶，可以裝東西。' },
  battery: { name:'電池',   glyph:'電', color:'#d3c15a', type:'mat', desc:'還有電的蓄電池。通訊設備的必需品。' },
  circuit: { name:'電路板', glyph:'路', color:'#5fa86b', type:'mat', desc:'從舊收音機裡拆出的電路板。' },
  antenna: { name:'天線',   glyph:'天', color:'#a8aab8', type:'mat', desc:'警局的通訊天線，訊號發射器的核心。' },

  /* ---- 食物 ---- */
  can:     { name:'罐頭',   glyph:'罐', color:'#c98a4b', type:'food', heal:25, desc:'過期了，但還能吃。回復 25 生命。' },
  bread:   { name:'麵包',   glyph:'包', color:'#c9a86b', type:'food', heal:15, desc:'有點硬。回復 15 生命。' },
  bar:     { name:'能量棒', glyph:'棒', color:'#b0b060', type:'food', heal:10, desc:'甜得發膩。回復 10 生命。' },
  bandage: { name:'繃帶',   glyph:'繃', color:'#d8d0c0', type:'food', heal:35, desc:'乾淨紗布。回復 35 生命。' },

function sanitizeName(raw){
  let n = String(raw == null ? '' : raw)
    .replace(/<[^>]*>/g, '')
    .replace(/[<>&"'`\\]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  if (!n) n = '阿鐵';
  return n.slice(0, 8);
}

function shade(hex){
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * .55);
  const g = Math.round(((n >> 8) & 255) * .55);
  const b = Math.round((n & 255) * .55);
  return `rgb(${r},${g},${b})`;
}

function buildMiniMap(terr, zone){
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i = y*W+x, t = terr[i];
    let col = '#2a2e34';
    if (t === T.SIDEWALK) col = '#454b53';
    else if (t === T.GRASS) col = '#33402f';
    else if (t === T.FLOOR) col = zone[i] ? shade(ZMAP[zone[i]].accent) : '#4a4740';
    else if (t === T.WALL) col = '#101216';
    else if (t === T.DOOR) col = '#b08a52';
    else if (t === T.BARRICADE) col = '#a8443a';
    g.fillStyle = col;
    g.fillRect(x, y, 1, 1);
  }
  return c;
}

function rollLoot(table, count){
  const t = LOOT[table] || LOOT.street;
  const out = [];
  let total = 0;
  for (const e of t) total += e.w;
  for (let i = 0; i < count; i++){
    let r = Math.random() * total, e = t[0];
    for (const cand of t){ r -= cand.w; if (r <= 0){ e = cand; break; } }
    const n = e.min + Math.floor(Math.random() * (e.max - e.min + 1));
    const found = out.find(x => x.id === e.id);
    if (found) found.n += n; else out.push({ id:e.id, n });
  }
  return out;
}

function updateCamera(){

  const maxX = W*TILE - VIEW_W, maxY = H*TILE - VIEW_H;

  CAM.y = clamp(Math.round(S.y*TILE + TILE/2 - VIEW_H/2), 0, maxY);
}


function terrAt(x,y){ return (x<0||y<0||x>=W||y>=H) ? T.WALL : MAP.terr[y*W+x]; }
function propAt(x,y){ return MAP.props.get(y*W+x) || null; }
function blocked(x,y){
  if (x<0||y<0||x>=W||y>=H) return true;
  const t = MAP.terr[y*W+x];
  if (t === T.WALL || t === T.BARRICADE) return true;
  const p = MAP.props.get(y*W+x);
  return !!(p && p.block);
}
function walkable(x,y){ return !blocked(x,y); }
function zoneAt(x,y){
  const id = MAP.zone[y*W+x];
  return id ? ZMAP[id] : null;
}
function inSafehouse(x,y){
  const z = zoneAt(x,y);
  return !!z && z.id === 'safehouse';
}
/* 探索階段安全屋是安全區：屍潮只能聚在門口，進不來 */
function zombieBlocked(x,y){
  if (blocked(x,y)) return true;
  if (S.phase !== 'holdout' && inSafehouse(x,y)) return true;
  return false;
}
function zombieAt(x,y){
  for (const z of S.zombies) if (z.x === x && z.y === y) return z;
  return null;
}

  say('目標：做出訊號發射器，把救援叫來。', 'warn');
  if (showIntro) showIntroModal();
  else { S.started = true; closeModal(); }
  refresh();
}

function spawnZombie(type,x,y){
  const d = ZOMBIES[type];
  const z = {
    uid: ++uid, type, name:d.name, hp:d.hp, maxHp:d.hp, atk:d.atk,
    speed:d.speed, sense:d.sense, size:d.size, range:d.range || 0,
    x, y, cd: 1 + rnd(d.speed), alerted:false, memory:0, home:{x,y},
  };
  S.zombies.push(z);
  return z;
}

/* =========================================================================
   3b. 存檔 / 讀檔（localStorage）
   ========================================================================= */
function saveGame(silent){
  if (!S || !S.started || S.phase === 'dead' || S.phase === 'won') return false;
  try {
    const payload = {
      v: SAVE_VERSION, ts: Date.now(),
      name: S.name, turn: S.turn, hp: S.hp, x: S.x, y: S.y, dir: S.dir,
      bag: S.bag, weapon: S.weapon, armor: S.armor,
      stash: S.stash, stashLv: S.stashLv,
      zombies: S.zombies.map(z => ({
        type:z.type, x:z.x, y:z.y, hp:z.hp, maxHp:z.maxHp, atk:z.atk,
        speed:z.speed, sense:z.sense, size:z.size, range:z.range,
        cd:z.cd, alerted:z.alerted, memory:z.memory, home:z.home,
      })),
      corpses: S.corpses,
      kills:S.kills, crafted:S.crafted, searches:S.searches,
      phase:S.phase, holdoutStart:S.holdoutStart, radioBuilt:S.radioBuilt,
      bp:S.bp, changes:S.changes,
      log:S.log.slice(0, 30),
      containers: MAP.containers.map(c => ({
        x:c.x, y:c.y, loot:c.loot, searched:c.searched, locked:c.locked, bp:c.bp,
      })),
      breaches: [...MAP.breaches].map(i => [i % W, Math.floor(i / W)]),
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    return true;
  } catch (e){
    if (!silent) say('存檔失敗：這個瀏覽器不允許寫入本機儲存。','bad');
    return false;
  }
}

function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || d.v !== SAVE_VERSION) return null;
    if (typeof d.turn !== 'number' || !Array.isArray(d.bag)) return null;
    return d;
  } catch (e){ return null; }
}

function clearSave(){
  try { localStorage.removeItem(SAVE_KEY); } catch (e){ /* ignore */ }
}

function continueGame(d){
  if (!d) return false;
  newGame(false, d.name);
  S.name = sanitizeName(d.name);
  PLAYER_NAME = S.name;
  S.turn = Math.max(0, d.turn | 0);
  S.hp = clamp(Number(d.hp) || 1, 1, S.maxHp);
  S.x = clamp(d.x | 0, 0, W-1);
  S.y = clamp(d.y | 0, 0, H-1);
  S.dir = (d.dir && typeof d.dir.x === 'number') ? { x: d.dir.x, y: d.dir.y } : { x:0, y:1 };
  S.bag = Array.isArray(d.bag)
    ? d.bag.filter(it => it && ITEM[it.id] && it.n > 0).map(it => ({
        id:it.id, n:Math.min(99, it.n|0), ...(it.dur ? { dur:it.dur|0 } : {}),
      }))
    : [];
  S.weapon = (d.weapon && ITEM[d.weapon.id] && ITEM[d.weapon.id].type === 'weapon')
    ? { id:d.weapon.id, dur:Math.max(1, d.weapon.dur|0) } : null;
  S.armor = (d.armor && ITEM[d.armor.id] && ITEM[d.armor.id].type === 'armor')
    ? { id:d.armor.id, dur:Math.max(1, d.armor.dur|0) } : null;
  S.stash = Array.isArray(d.stash)
    ? d.stash.filter(it => it && ITEM[it.id] && it.n > 0).map(it => ({
        id:it.id, n:Math.min(99, it.n|0), ...(it.dur ? { dur:it.dur|0 } : {}),
      }))
    : [];
  S.stashLv = clamp((d.stashLv | 0) || 1, 1, STASH_CAPS.length);
  S.kills = d.kills | 0;
  S.crafted = d.crafted | 0;
  S.searches = d.searches | 0;
  S.phase = d.phase === 'holdout' ? 'holdout' : 'explore';
  S.holdoutStart = d.holdoutStart | 0;
  S.radioBuilt = !!d.radioBuilt;
  S.bp = (d.bp && typeof d.bp === 'object') ? d.bp : {};
  S.corpses = Array.isArray(d.corpses) ? d.corpses : [];

  S.zombies = [];
  for (const z of (Array.isArray(d.zombies) ? d.zombies : [])){
    const def = ZOMBIES[z && z.type];
    if (!def) continue;
    S.zombies.push({
      uid: ++uid, type: z.type, name: def.name,
      hp: clamp(Number(z.hp) || 1, 1, Number(z.maxHp) || def.hp),
      maxHp: Number(z.maxHp) || def.hp, atk: Number(z.atk) || def.atk,
      speed: Number(z.speed) || def.speed, sense: Number(z.sense) || def.sense,
      size: Number(z.size) || def.size, range: Number(z.range) || 0,
      x: clamp(z.x | 0, 0, W-1), y: clamp(z.y | 0, 0, H-1),
      cd: Math.max(1, z.cd | 0), alerted: !!z.alerted, memory: Number(z.memory) || 0,
      home: (z.home && typeof z.home.x === 'number') ? { x:z.home.x|0, y:z.home.y|0 } : { x:z.x|0, y:z.y|0 },
    });
  }

  for (const c of (Array.isArray(d.containers) ? d.containers : [])){
    const p = propAt(c.x, c.y);
    if (!p || !p.searchable) continue;
    p.loot = Array.isArray(c.loot) ? c.loot.filter(e => e && ITEM[e.id] && e.n > 0) : [];
    p.searched = !!c.searched;
    p.locked = c.locked || null;
    p.bp = c.bp || null;
  }

  S.changes = Array.isArray(d.changes) ? d.changes : [];
  for (const ch of S.changes){
    if (ch && ch.x >= 0 && ch.y >= 0 && ch.x < W && ch.y < H) MAP.terr[ch.y*W+ch.x] = ch.t;
  }
  MAP.breaches = new Set((Array.isArray(d.breaches) ? d.breaches : [])
    .filter(p => Array.isArray(p) && p.length === 2)
    .map(([x,y]) => y*W + x));
  MAP.mini = buildMiniMap(MAP.terr, MAP.zone);

  if (Array.isArray(d.log) && d.log.length){
    S.log = d.log.slice(0, 30).map(l => ({
      text: String(l && l.text || ''), kind: (l && l.kind) || 'info', turn: Number(l && l.turn) || 0,
    }));
  }

  S.started = true;
  modalLock = false;
  closeModal();
  updateCamera();
  say(`讀取進度：${S.name} · 第 ${S.turn} 回合。`, 'sys');
  refresh();
  startMusic();
  canvas.focus();
  saveGame(true);
  return true;
}

function beginRun(name){
  if (!S) return;
  const n = sanitizeName(name);
  S.name = n;
  PLAYER_NAME = n;
  /* 開場那句「你叫…」是建立狀態時寫的，改成玩家剛輸入的名字 */
  for (const l of S.log){
    if (l.text.indexOf('你叫') === 0){
      l.text = `你叫${n}。安全屋的箱子裡還有一點材料，工作臺就在旁邊。`;
    }
  }
  S.started = true;
  modalLock = false;
  closeModal();
  refresh();
  canvas.focus();
  say('你握緊木棒，推開了門。','info');
  sfx('unlock');
  startMusic();
  saveGame(true);
  renderUI();
}

/* =========================================================================
   4. 繪製
   ========================================================================= */
const UI_FONT = '"Segoe UI","Microsoft JhengHei","Microsoft YaHei","PingFang TC",sans-serif';
const MONO = 'Consolas,"Courier New",monospace';

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#121417';
  ctx.fillRect(0,0,VIEW_W,VIEW_H);

  ctx.save();
  ctx.translate(-CAM.x, -CAM.y);
  const x0 = clamp(Math.floor(CAM.x/TILE) - 1, 0, W-1);
  const x1 = clamp(Math.ceil((CAM.x + VIEW_W)/TILE) + 1, 0, W-1);
  const y0 = clamp(Math.floor(CAM.y/TILE) - 1, 0, H-1);
  const y1 = clamp(Math.ceil((CAM.y + VIEW_H)/TILE) + 1, 0, H-1);
  for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) drawTile(x,y);
  drawRoadMarks();
  drawZoneLabels();
  drawDecals();
  drawProps();
  drawCorpses();
  drawZombies();
  drawPlayer();
  drawFaceMarker();
  ctx.restore();

  drawVignette();
  drawBanner();
  drawMinimap();
}

function drawTile(x,y){
  const i = y*W+x, t = MAP.terr[i];
  const px = x*TILE, py = y*TILE;
  const zid = MAP.zone[i];
  const z = zid ? ZMAP[zid] : null;

  if (t === T.STREET){
    ctx.fillStyle = '#292d33'; ctx.fillRect(px,py,TILE,TILE);
    const h = hash2(x,y);
    if (h > .82){ ctx.fillStyle = '#2e3239'; ctx.fillRect(px+3,py+5,6,3); }
    if (h < .10){ ctx.fillStyle = '#23262b'; ctx.fillRect(px+9,py+14,10,2); }
    if (h > .35 && h < .40){ ctx.fillStyle = '#31353c'; ctx.fillRect(px+14,py+4,3,3); }
  } else if (t === T.SIDEWALK){
    ctx.fillStyle = '#42474f'; ctx.fillRect(px,py,TILE,TILE);
    ctx.fillStyle = '#3a3f46';
    ctx.fillRect(px,py+TILE-2,TILE,2); ctx.fillRect(px+TILE-2,py,2,TILE);
    if (terrAt(x,y+1) === T.STREET || terrAt(x,y-1) === T.STREET ||
        terrAt(x+1,y) === T.STREET || terrAt(x-1,y) === T.STREET){
      ctx.fillStyle = '#565c65'; ctx.fillRect(px,py,TILE,1);
    }
  } else if (t === T.GRASS){
    ctx.fillStyle = '#303a2d'; ctx.fillRect(px,py,TILE,TILE);
    const h = hash2(x*2,y*3);
    ctx.fillStyle = '#3a4733';
    ctx.fillRect(px+4+h*8, py+6, 2, 5);
    ctx.fillRect(px+14-h*6, py+14, 2, 4);
    if (h > .7){ ctx.fillStyle = '#43503a'; ctx.fillRect(px+9, py+9, 5, 2); }
  } else if (t === T.FLOOR){
    ctx.fillStyle = '#34322c'; ctx.fillRect(px,py,TILE,TILE);
    if (z){ ctx.globalAlpha = .12; ctx.fillStyle = z.accent; ctx.fillRect(px,py,TILE,TILE); ctx.globalAlpha = 1; }
    ctx.fillStyle = '#3e3b34';
    ctx.fillRect(px,py+TILE-1,TILE,1); ctx.fillRect(px+TILE-1,py,1,TILE);
    const h = hash2(x+7,y+3);
    if (h > .88){ ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(px+6,py+8,9,6); }
  } else if (t === T.WALL){
    ctx.fillStyle = '#1c1f24'; ctx.fillRect(px,py,TILE,TILE);
    ctx.fillStyle = '#2b2f36'; ctx.fillRect(px,py,TILE,3);
    ctx.fillStyle = '#111317'; ctx.fillRect(px,py+TILE-2,TILE,2);
    if (z){ ctx.globalAlpha = .5; ctx.fillStyle = z.accent; ctx.fillRect(px,py,TILE,2); ctx.globalAlpha = 1; }
  } else if (t === T.DOOR || t === T.BARRICADE){
    ctx.fillStyle = '#34322c'; ctx.fillRect(px,py,TILE,TILE);
    if (MAP.breaches && MAP.breaches.has(i)){
      /* 屍潮撞開的牆洞 */
      ctx.fillStyle = '#15130f'; ctx.fillRect(px+1,py+1,TILE-2,TILE-2);
      ctx.fillStyle = '#0a0908'; ctx.fillRect(px+4,py+4,TILE-8,TILE-8);
      ctx.fillStyle = '#3a3126';
      ctx.fillRect(px+1,py+1,4,3); ctx.fillRect(px+TILE-5,py+2,3,4);
      ctx.fillRect(px+2,py+TILE-6,5,4); ctx.fillRect(px+TILE-7,py+TILE-5,6,4);
      ctx.fillStyle = '#4a3d2c';
      ctx.fillRect(px+3,py+TILE-4,3,2); ctx.fillRect(px+TILE-6,py+5,2,2);
    } else {
      ctx.fillStyle = '#3b2f20'; ctx.fillRect(px+2,py+1,TILE-4,TILE-2);
      ctx.fillStyle = '#6b5436'; ctx.fillRect(px+3,py+2,TILE-6,TILE-5);
      ctx.fillStyle = '#7d6440'; ctx.fillRect(px+4,py+3,TILE-9,TILE-8);
      ctx.fillStyle = '#e0c07a'; ctx.fillRect(px+TILE-8,py+TILE/2-1,2,3);
      if (t === T.BARRICADE){
        ctx.strokeStyle = '#8a8f96'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px+1,py+4); ctx.lineTo(px+TILE-1,py+TILE-4);
        ctx.moveTo(px+1,py+TILE-4); ctx.lineTo(px+TILE-1,py+4);
        ctx.stroke();
        ctx.fillStyle = '#a8443a'; ctx.fillRect(px+1,py+TILE-7,TILE-2,3);
      }
    }
  }

  if (z && (t === T.FLOOR || t === T.WALL)){
    // 建築內部陰影
    if (t === T.FLOOR && (terrAt(x,y-1) === T.WALL)){
      ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(px,py,TILE,4);
    }
  }
}

function drawRoadMarks(){
  ctx.fillStyle = 'rgba(214,182,92,.26)';
  for (let x=1;x<W-1;x+=2) ctx.fillRect(x*TILE+2, 18*TILE, TILE-5, 2);
  for (let y=1;y<H-1;y+=2) ctx.fillRect(32*TILE, y*TILE+2, 2, TILE-5);
  /* 路口斑馬線 */
  ctx.fillStyle = 'rgba(220,220,210,.09)';
  for (let i=0;i<9;i++) ctx.fillRect(30*TILE + i*6, 15*TILE + 2, 4, TILE-4);
  for (let i=0;i<9;i++) ctx.fillRect(30*TILE + i*6, 20*TILE + 2, 4, TILE-4);
}

function drawZoneLabels(){
  ctx.textAlign = 'center';
  for (const z of ZONES){
    const cx = z.label[0]*TILE+TILE/2, cy = z.label[1]*TILE+TILE/2;
    ctx.globalAlpha = .46;
    ctx.fillStyle = z.accent;
    ctx.font = `700 12px ${UI_FONT}`;
    ctx.fillText(z.name, cx, cy+3);
    ctx.globalAlpha = .24;
    ctx.fillStyle = '#e8e2d4';
    ctx.font = `600 6.5px ${MONO}`;
    ctx.fillText(z.en, cx, cy+12);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
}

function drawDecals(){
  for (const d of MAP.decals){
    ctx.save();
    ctx.globalAlpha = d.a;
    ctx.fillStyle = '#3d1216';
    ctx.beginPath(); ctx.ellipse(d.x,d.y,d.rx,d.ry,d.rot,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = d.a * .7;
    ctx.fillStyle = '#240a0c';
    ctx.beginPath(); ctx.ellipse(d.x+d.rx*.3,d.y-d.ry*.2,d.rx*.4,d.ry*.4,d.rot,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawProps(){
  MAP.props.forEach(p => drawProp(p));
}

function drawProp(p){
  const px = p.x*TILE, py = p.y*TILE;
  const cx = px+TILE/2, cy = py+TILE/2;
  const k = p.kind;

  if (k !== 'tree'){
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    ctx.beginPath(); ctx.ellipse(cx, cy+8, 9, 3.5, 0, 0, Math.PI*2); ctx.fill();
  }

  if (p.searchable && p.searched) ctx.globalAlpha = .48;

  if (k === 'crate'){
    ctx.fillStyle = '#6b4a2c'; ctx.fillRect(px+3,py+4,18,16);
    ctx.fillStyle = '#7d5a36'; ctx.fillRect(px+3,py+4,18,4);
    ctx.strokeStyle = '#4a331d'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px+4,py+5); ctx.lineTo(px+20,py+19);
    ctx.moveTo(px+20,py+5); ctx.lineTo(px+4,py+19);
    ctx.stroke();
    ctx.strokeStyle = '#33240f'; ctx.strokeRect(px+3.5,py+4.5,17,15);
  } else if (k === 'shelf'){
    ctx.fillStyle = '#4a4f56'; ctx.fillRect(px+3,py+2,18,20);
    ctx.fillStyle = '#3a3f45'; ctx.fillRect(px+5,py+4,14,4);
    ctx.fillRect(px+5,py+10,14,4);
    ctx.fillRect(px+5,py+16,14,4);
    ctx.fillStyle = '#8a5a36'; ctx.fillRect(px+6,py+5,5,2);
    ctx.fillStyle = '#5f7a5a'; ctx.fillRect(px+12,py+11,4,2);
    ctx.fillStyle = '#8a7a4a'; ctx.fillRect(px+8,py+17,7,2);
  } else if (k === 'locker'){
    ctx.fillStyle = '#54616d'; ctx.fillRect(px+4,py+2,16,20);
    ctx.fillStyle = '#65737f'; ctx.fillRect(px+5,py+3,7,18);
    ctx.fillStyle = '#141719'; ctx.fillRect(px+12,py+3,1,18);
    ctx.fillStyle = '#c9ced6'; ctx.fillRect(px+10,py+11,2,4);
    ctx.fillStyle = '#3d4852'; ctx.fillRect(px+6,py+5,3,1);
    ctx.fillStyle = '#5a6a4a'; ctx.fillRect(px+6,py+7,4,2);
  } else if (k === 'fridge'){
    ctx.fillStyle = '#b9c2c4'; ctx.fillRect(px+4,py+2,16,20);
    ctx.fillStyle = '#d0d8d8'; ctx.fillRect(px+5,py+3,14,8);
    ctx.fillStyle = '#8c989a'; ctx.fillRect(px+5,py+12,14,1);
    ctx.fillStyle = '#5f6a6a'; ctx.fillRect(px+16,py+6,1.5,6);
    ctx.fillStyle = '#6d8280'; ctx.fillRect(px+7,py+15,8,3);
  } else if (k === 'cabinet'){
    ctx.fillStyle = '#7d8488'; ctx.fillRect(px+3,py+2,18,20);
    ctx.fillStyle = '#949c9f'; ctx.fillRect(px+4,py+3,16,7);
    ctx.fillStyle = '#949c9f'; ctx.fillRect(px+4,py+12,16,9);
    ctx.fillStyle = '#525a5e'; ctx.fillRect(px+10,py+9,4,2);
    ctx.fillStyle = '#e6e0d0'; ctx.fillRect(px+7,py+5,3,2);
  } else if (k === 'dumpster'){
    ctx.fillStyle = '#2f4230'; ctx.fillRect(px+2,py+7,20,14);
    ctx.fillStyle = '#3b523b'; ctx.fillRect(px+2,py+5,20,5);
    ctx.fillStyle = '#22301f'; ctx.fillRect(px+4,py+6,16,2);
    ctx.fillStyle = '#4a6347'; ctx.fillRect(px+5,py+13,5,2);
    ctx.fillStyle = '#1c271a'; ctx.fillRect(px+2,py+19,20,2);
  } else if (k === 'workbench'){
    ctx.fillStyle = '#3d2f20'; ctx.fillRect(px+2,py+6,20,4);
    ctx.fillStyle = '#5a4630'; ctx.fillRect(px+2,py+10,20,9);
    ctx.fillStyle = '#2e2418'; ctx.fillRect(px+3,py+13,18,1);
    ctx.fillStyle = '#8a7a52'; ctx.fillRect(px+5,py+3,7,2);
    ctx.fillStyle = '#9aa0a8'; ctx.fillRect(px+14,py+3,4,4);
    ctx.fillStyle = '#b04a3a'; ctx.fillRect(px+15,py+10,2,4);
    ctx.fillStyle = '#7d8488'; ctx.fillRect(px+6,py+10,3,3);
    if (!p.searched){
      ctx.fillStyle = 'rgba(224,161,60,.10)';
      ctx.fillRect(px+1,py+1,22,22);
    }
  } else if (k === 'stash'){
    /* 儲物櫃：兩門鐵櫃，門上貼一張黃標 */
    ctx.fillStyle = '#2c343c'; ctx.fillRect(px+2,py+1,20,22);
    ctx.fillStyle = '#48545f'; ctx.fillRect(px+3,py+2,8,20);
    ctx.fillStyle = '#505d69'; ctx.fillRect(px+12,py+2,9,20);
    ctx.fillStyle = '#1b2127'; ctx.fillRect(px+11,py+2,1,20);
    ctx.fillStyle = '#c9ced6'; ctx.fillRect(px+9,py+11,2,4);
    ctx.fillRect(px+13,py+11,2,4);
    ctx.fillStyle = '#d8c27a'; ctx.fillRect(px+14,py+5,5,4);
    ctx.fillStyle = '#3a3020'; ctx.fillRect(px+15,py+6,3,1);
    ctx.fillStyle = 'rgba(224,161,60,.10)';
    ctx.fillRect(px+1,py+1,22,22);
  } else if (k === 'car'){
    ctx.fillStyle = p.color || '#4a4a4a';
    rr(px+2,py+5,20,14,3); ctx.fill();
    ctx.fillStyle = '#1c2228';
    ctx.fillRect(px+6,py+7,5,4); ctx.fillRect(px+13,py+7,5,4);
    ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.fillRect(px+3,py+6,18,1);
    ctx.fillStyle = '#2a2d31'; ctx.fillRect(px+4,py+18,4,3); ctx.fillRect(px+16,py+18,4,3);
    ctx.fillStyle = '#3a3d40'; ctx.fillRect(px+8,py+12,8,4);
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1; ctx.strokeRect(px+2.5,py+5.5,19,13);
  } else if (k === 'tree'){
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(cx+2, cy+7, 9, 3.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a2f22'; ctx.fillRect(cx-2,cy-2,4,10);
    ctx.fillStyle = '#2e4229';
    ctx.beginPath(); ctx.arc(cx-3,cy-8,7,0,Math.PI*2); ctx.fill();

  const d = ZOMBIES[z.type];
  const body = z.type === 'boss' ? '#6a4058' : z.type === 'brute' ? '#6a5a48' : z.type === 'crawler' ? '#7a6b3d' : z.type === 'spitter' ? '#77773c' : '#55704a';
  const head = z.type === 'boss' ? '#9a6a8a' : z.type === 'spitter' ? '#a0a05a' : '#7d9a63';
  const dirX = Math.sign(S.x - z.x) || 0;

  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.36)';

  /* 前伸的手臂 */
  ctx.strokeStyle = body; ctx.lineWidth = 2.4*s; ctx.lineCap = 'round';
  const ax = dirX || (Math.random() < .5 ? 1 : -1);
  ctx.beginPath();
  ctx.moveTo(cx + ax*4*s, cy - 2*s);
  ctx.lineTo(cx + ax*9*s, cy - 1*s + (dirY*2*s));
  ctx.stroke();

  ctx.fillStyle = head;
  ctx.beginPath(); ctx.arc(cx, cy-8.5*s, 4.6*s, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.arc(cx+1.5*s, cy-8.5*s, 4.6*s, -0.7, 1.6); ctx.fill();

  /* 眼睛 */
  ctx.fillStyle = z.type === 'boss' ? '#e05ac0' : '#e04a3a';

  ctx.fillRect(cx+1.1*s-0.5, cy-9.6*s, 1.6*s, 1.6*s);

    ctx.fillStyle = '#b8c255';

}

/* =========================================================================
   5. 背包
   ========================================================================= */
function countOf(id){
  let n = 0;
  for (const s of S.bag) if (s.id === id) n += s.n;
  return n;
}
function hasItem(id){ return countOf(id) > 0; }
function isStack(d){ return d.type === 'mat' || d.type === 'food' || d.type === 'quest'; }

function addItem(id, n, dur){
  const d = ITEM[id];
  if (!d) return 0;
  if (isStack(d)){
    const s = S.bag.find(b => b.id === id);
    if (s){ s.n += n; return n; }
    if (S.bag.length < CAP){ S.bag.push({ id, n }); return n; }
    return 0;
  }
  if (S.bag.length < CAP){
    S.bag.push({ id, n:1, dur: dur === undefined ? d.dur : dur });
    return 1;
  }
  return 0;
}

function removeItem(id, n){
  let left = n;
  for (let i = S.bag.length - 1; i >= 0 && left > 0; i--){
    const s = S.bag[i];
    if (s.id !== id) continue;
    const take = Math.min(s.n, left);
    s.n -= take;
    left -= take;
    if (s.n <= 0) S.bag.splice(i,1);
  }
  return left === 0;
}

function hasSpaceFor(id){
  const d = ITEM[id];
  if (isStack(d)) return !!S.bag.find(s => s.id === id) || S.bag.length < CAP;
  return S.bag.length < CAP;
}

function dropItem(i){
  const s = S.bag[i];
  if (!s) return;
  if (s.id === 'radio'){ say('這是最後的希望，不能丟。','warn'); return; }
  S.bag.splice(i,1);
  say(`丟掉了${ITEM[s.id].name}。`,'info');
  refresh();
  saveGame(true);
}

function equipItem(i){
  const s = S.bag[i];
  if (!s) return;
  const d = ITEM[s.id];
  const kind = d.type;
  if (kind !== 'weapon' && kind !== 'armor') return;
  const prev = S[kind];
  S.bag.splice(i,1);
  S[kind] = { id:s.id, dur: s.dur === undefined ? d.dur : s.dur };
  if (prev) S.bag.push({ id: prev.id, n:1, dur: prev.dur });
  say(`裝備了${d.name}。`,'good');
  sfx('equip');
  refresh();
  saveGame(true);
}

function eatItem(i){
  const s = S.bag[i];
  if (!s) return;
  const d = ITEM[s.id];
  if (d.type !== 'food') return;
  if (S.hp >= S.maxHp){ say('你的狀態很好，不需要進食。','warn'); return; }
  const heal = Math.min(d.heal, S.maxHp - S.hp);
  S.hp += heal;
  /* 一次只吃一個：同格堆疊要逐個扣除，不能整格刪掉 */
  s.n -= 1;
  if (s.n <= 0) S.bag.splice(i,1);
  say(`你吃下${d.name}，回復 ${heal} 點生命${s.n > 0 ? `（還剩 ${s.n} 個）` : ''}。`,'good');
  sfx('eat');
  endTurn();
}

function useBag(i){
  if (!S || !S.started || !alive()) return;
  const s = S.bag[i];
  if (!s) return;
  const d = ITEM[s.id];
  if (d.type === 'weapon' || d.type === 'armor'){ equipItem(i); return; }
  if (d.type === 'food'){ eatItem(i); return; }
  say(`${d.name}：${d.desc}`,'info');
  renderUI();
}

function eatBest(){
  if (!S || !S.started || !alive()) return;
  let best = -1, bestHeal = -1;
  S.bag.forEach((s,i) => {
    const d = ITEM[s.id];
    if (d.type === 'food' && d.heal > bestHeal){ bestHeal = d.heal; best = i; }
  });
  if (best < 0){ say('背包裡沒有食物。','warn'); sfx('nope'); return; }
  eatItem(best);
}

/* =========================================================================
   5b. 安全屋儲物櫃
   ========================================================================= */
function stashCap(){
  const lv = clamp(S.stashLv | 0, 1, STASH_CAPS.length);
  return STASH_CAPS[lv - 1];
}
function stashCount(id){
  let n = 0;
  for (const s of S.stash) if (s.id === id) n += s.n;
  return n;
}
function addToStash(id, n, dur){
  const d = ITEM[id];
  if (!d) return 0;
  if (isStack(d)){
    const slot = S.stash.find(s => s.id === id);
    if (slot){ slot.n += n; return n; }
    if (S.stash.length < stashCap()){ S.stash.push({ id, n }); return n; }
    return 0;
  }
  if (S.stash.length < stashCap()){
    S.stash.push({ id, n:1, dur: dur === undefined ? d.dur : dur });
    return 1;
  }
  return 0;
}
function countAny(id){ return countOf(id) + stashCount(id); }
function consumeAny(id, n){
  let left = n;
  const fromBag = Math.min(left, countOf(id));
  if (fromBag > 0){ removeItem(id, fromBag); left -= fromBag; }
  for (let i = S.stash.length - 1; i >= 0 && left > 0; i--){
    const s = S.stash[i];
    if (s.id !== id) continue;
    const take = Math.min(s.n, left);
    s.n -= take;
    left -= take;
    if (s.n <= 0) S.stash.splice(i, 1);
  }
  return left === 0;
}

function bagToStash(i, whole){
  if (!S || !S.started || !alive()) return;
  const s = S.bag[i];
  if (!s) return;
  if (s.id === 'radio'){ say('發射器要留在身上，不能收進櫃子。','warn'); sfx('nope'); return; }
  const d = ITEM[s.id];
  const want = whole && isStack(d) ? s.n : 1;
  let moved = 0;
  for (let k = 0; k < want; k++){
    if (addToStash(s.id, 1, s.dur) === 0) break;
    moved++;
  }
  if (!moved){ say('儲物櫃滿了，先擴建或取出一些東西。','warn'); sfx('nope'); return; }
  s.n -= moved;
  if (s.n <= 0) S.bag.splice(i, 1);
  say(`存入${d.name}${moved > 1 ? ' ×' + moved : ''}。`, 'info');
  sfx('pickup');
  saveGame(true);
  renderStash();
  renderUI();
}

function stashToBag(i, whole){
  if (!S || !S.started || !alive()) return;
  const s = S.stash[i];
  if (!s) return;
  const d = ITEM[s.id];
  if (!hasSpaceFor(s.id)){ say('背包滿了，先丟點東西或用掉材料。','warn'); sfx('nope'); return; }
  const want = whole && isStack(d) ? s.n : 1;
  let moved = 0;
  for (let k = 0; k < want; k++){
    if (addItem(s.id, 1, s.dur) === 0) break;
    moved++;
  }
  if (!moved){ say('背包滿了。','warn'); sfx('nope'); return; }
  s.n -= moved;
  if (s.n <= 0) S.stash.splice(i, 1);
  say(`取出${d.name}${moved > 1 ? ' ×' + moved : ''}。`, 'info');
  sfx('pickup');
  saveGame(true);
  renderStash();
  renderUI();
}

function depositAllMaterials(){
  let moved = 0;
  for (let i = S.bag.length - 1; i >= 0; i--){
    const s = S.bag[i];
    if (!s) continue;
    const d = ITEM[s.id];
    if (!d || d.type !== 'mat') continue;
    const n = s.n;
    for (let k = 0; k < n; k++){
      if (addToStash(s.id, 1) === 0) break;
      s.n--; moved++;
    }
    if (s.n <= 0) S.bag.splice(i, 1);
  }
  say(moved ? `存入 ${moved} 件材料。` : '背包裡沒有材料可以存。', moved ? 'good' : 'warn');
  if (moved) sfx('pickup'); else sfx('nope');
  saveGame(true); renderStash(); renderUI();
}

function withdrawAll(){
  let moved = 0;
  for (let i = S.stash.length - 1; i >= 0; i--){
    const s = S.stash[i];
    if (!s) continue;
    const n = s.n;
    for (let k = 0; k < n; k++){
      if (addItem(s.id, 1, s.dur) === 0) break;
      s.n--; moved++;
    }
    if (s.n <= 0) S.stash.splice(i, 1);
  }
  say(moved ? `取出 ${moved} 件物品。` : '儲物櫃是空的。', moved ? 'good' : 'warn');
  if (moved) sfx('pickup'); else sfx('nope');
  saveGame(true); renderStash(); renderUI();
}

function upgradeStash(){
  const lv = S.stashLv | 0;
  if (lv >= STASH_CAPS.length){ say('儲物櫃已經是最大容量。','warn'); return; }
  const cost = STASH_UPGRADES[lv];
  const need = Object.entries(cost);
  const missing = need.filter(([id, n]) => countAny(id) < n);
  if (missing.length){
    say('材料不足：' + missing.map(([id, n]) => `${ITEM[id].name} ${countAny(id)}/${n}`).join('、'), 'warn');
    sfx('nope');
    return;
  }
  for (const [id, n] of need) consumeAny(id, n);
  S.stashLv = lv + 1;
  say(`儲物櫃擴建到 ${stashCap()} 格。`, 'good');
  sfx('craft');
  saveGame(true); renderStash(); renderUI();
}

function stashSlotMarkup(s, attr){
  if (!s) return '<div class="slot empty"></div>';
  const d = ITEM[s.id];
  const isGear = d.type === 'weapon' || d.type === 'armor';
  const dur = isGear ? (s.dur === undefined ? d.dur : s.dur) : 0;
  const cnt = isStack(d) && s.n > 1 ? `<b class="cnt">${s.n}</b>` : '';
  const durbar = isGear ? `<i class="durbar"><b style="width:${clamp(dur / d.dur, 0, 1) * 100}%"></b></i>` : '';
  const tip = isGear ? `${d.name} · 耐久 ${dur}/${d.dur}` : d.name;
  return `<div class="slot" ${attr} title="${tip}"><span class="g" style="color:${d.color}">${d.glyph}</span>${cnt}${durbar}</div>`;
}

function renderStash(){
  if (!S) return;
  const cap = stashCap();
  const lv = S.stashLv | 0;
  const bagSlots = Array.from({ length: CAP }, (_, i) =>
    stashSlotMarkup(S.bag[i], `data-stash-bag="${i}"`)).join('');
  const stashSlots = Array.from({ length: cap }, (_, i) =>
    stashSlotMarkup(S.stash[i], `data-stash-item="${i}"`)).join('');
  const next = lv < STASH_CAPS.length ? STASH_UPGRADES[lv] : null;
  const upOk = !!next && Object.entries(next).every(([id, n]) => countAny(id) >= n);
  const upHtml = next
    ? `<button class="btn" data-act="stash-upgrade" ${upOk ? '' : 'disabled'}>擴建到 Lv.${lv + 1}（${Object.entries(next).map(([id, n]) => `${ITEM[id].name} ${countAny(id)}/${n}`).join(' · ')}）</button>`
    : `<span class="badge">已達最大容量 ${cap} 格</span>`;
  openModal(`<div class="modal-card" style="width:min(920px,100%)">
    <div class="mc-head"><div><h2>儲物櫃</h2><p>安全屋 · 背包放不下的東西先放這裡</p></div><button class="mc-x" data-act="close">×</button></div>
    <div class="stashgrid">
      <section class="stash-panel">
        <div class="stash-head"><span>背包</span><span class="dim">${S.bag.length} / ${CAP}</span></div>
        <div class="stash-slots">${bagSlots}</div>
      </section>
      <section class="stash-panel">
        <div class="stash-head"><span>儲物櫃 · Lv.${lv}</span><span class="dim">${S.stash.length} / ${cap}</span></div>
        <div class="stash-slots wide">${stashSlots}</div>
      </section>
    </div>
    <div class="stash-tools">
      <button class="btn" data-act="stash-deposit-all">存入全部材料</button>
      <button class="btn" data-act="stash-withdraw-all">取出全部</button>
      ${upHtml}
      <span class="savehint">點擊移動 1 個 · Shift+點擊整組</span>
    </div>
  </div>`, false);
}

function openStash(){
  if (!S || !S.started || !alive()) return;
  ensureAudio();
  renderStash();
  sfx('equip');
}

function nearStash(){
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
    const p = propAt(S.x + dx, S.y + dy);
    if (p && p.kind === 'stash') return true;
  }
  return false;
}

/* =========================================================================
   6. 日誌與音效
   ========================================================================= */
function say(text, kind){
  if (!S) return;
  S.log.unshift({ text, kind: kind || 'info', turn: S.turn });
  if (S.log.length > 60) S.log.pop();
}

function ensureAudio(){
  if (!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e){ AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  if (AC) startMusic();
}

/* ---------- 背景音樂：低音持續音 + 稀疏五聲音階 pad，屍潮時加快加脈衝 ---------- */
let MUSIC_ON = true;
let musicBus = null, musicTimer = null, nextNote = 0, droneOn = false;
const PENTA = [146.83, 174.61, 196.00, 220.00, 261.63, 293.66, 349.23];

function initMusic(){
  if (!AC || droneOn) return;
  musicBus = AC.createGain();
  musicBus.gain.value = MUSIC_ON ? .5 : 0;
  musicBus.connect(AC.destination);

  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 240; lp.Q.value = .7;
  const dg = AC.createGain(); dg.gain.value = .05;
  lp.connect(dg); dg.connect(musicBus);
  [55, 82.41, 110].forEach((f, i) => {
    const o = AC.createOscillator();
    o.type = i === 0 ? 'sine' : 'triangle';
    o.frequency.value = f;
    o.detune.value = (i - 1) * 5;
    o.connect(lp);
    o.start();
  });
  droneOn = true;
}

function startMusic(){
  if (!AC) return;
  initMusic();
  if (musicBus){
    musicBus.gain.cancelScheduledValues(AC.currentTime);
    musicBus.gain.setTargetAtTime(MUSIC_ON ? .5 : 0, AC.currentTime, .4);
  }
  if (musicTimer) return;
  nextNote = AC.currentTime + 1.0;
  musicTimer = setInterval(musicTick, 250);
}

function stopMusic(){
  if (musicTimer){ clearInterval(musicTimer); musicTimer = null; }
  if (musicBus && AC){
    musicBus.gain.cancelScheduledValues(AC.currentTime);
    musicBus.gain.setTargetAtTime(0.0001, AC.currentTime, .5);
  }
}

function playPad(t){
  const f = PENTA[Math.floor(Math.random() * PENTA.length)];
  for (const [freq, type, vol, det] of [[f, 'triangle', .05, 0], [f * 2.005, 'sine', .028, 3]]){
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq; o.detune.value = det;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 1.1);
    g.gain.exponentialRampToValueAtTime(.0001, t + 3.6);
    o.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + 3.8);
  }
}

function playPulse(t){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(72, t);
  o.frequency.exponentialRampToValueAtTime(38, t + .22);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.05, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + .28);
  o.connect(g); g.connect(musicBus);
  o.start(t); o.stop(t + .3);
}

function musicTick(){
  if (!AC || !musicBus) return;
  const hold = S && S.phase === 'holdout';
  const horizon = AC.currentTime + 1.2;
  let guard = 0;
  while (nextNote < horizon && guard++ < 4){
    playPad(nextNote);
    if (hold) playPulse(nextNote + .45);
    nextNote += hold ? 2.1 : 3.5;
  }
}

function tone(freq, dur, type, vol, slide){
  if (!AC || MUTED) return;
  try {
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(Math.max(30, freq), t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || .04, t + .006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + .03);
  } catch (e){ /* 音訊不可用時靜默 */ }
}

function sfx(kind){
  if (!AC || MUTED) return;
  if (kind === 'step') tone(150, .025, 'sine', .015, -40);
  else if (kind === 'hit'){ tone(150, .055, 'square', .045, -80); tone(90, .08, 'sawtooth', .03, -30); }
  else if (kind === 'kill'){ tone(75, .18, 'sawtooth', .05, -35); }
  else if (kind === 'hurt'){ tone(110, .16, 'sawtooth', .055, -55); }
  else if (kind === 'eat'){ tone(380, .07, 'sine', .04, 120); setTimeout(() => tone(520, .08, 'sine', .035, 90), 70); }
  else if (kind === 'craft'){ tone(300, .07, 'triangle', .05, 140); setTimeout(() => tone(460, .1, 'triangle', .04, 120), 80); }
  else if (kind === 'pickup'){ tone(520, .05, 'sine', .03, 200); }
  else if (kind === 'equip'){ tone(220, .06, 'square', .03, 120); }
  else if (kind === 'unlock'){ tone(240, .09, 'square', .04, -90); }
  else if (kind === 'nope'){ tone(140, .07, 'square', .03, -30); }
  else if (kind === 'alarm'){ tone(600, .16, 'square', .04, -180); setTimeout(() => tone(500, .2, 'square', .04, -120), 200); }
  else if (kind === 'win'){ [392, 494, 587, 784].forEach((f,i) => setTimeout(() => tone(f, .22, 'triangle', .045, 20), i*130)); }
  else if (kind === 'lose'){ [220, 180, 140, 90].forEach((f,i) => setTimeout(() => tone(f, .26, 'sawtooth', .045, -20), i*150)); }
}

/* =========================================================================
   7. 行動
   ========================================================================= */
function alive(){ return S && S.phase !== 'dead' && S.phase !== 'won'; }

function tryMove(dx, dy){
  if (!S || !S.started || !alive() || modalOpen) return;
  S.dir = { x: dx, y: dy };
  const nx = S.x + dx, ny = S.y + dy;
  const z = zombieAt(nx, ny);
  if (z){ attackZombie(z); endTurn(); return; }
  const t = terrAt(nx, ny);
  if (t === T.BARRICADE){
    say('大門被鐵鏈鎖死了。需要一根撬棍。','warn');
    sfx('nope');
    draw(); renderUI();
    return;
  }
  if (!walkable(nx, ny)){
    const p = propAt(nx, ny);
    say(p ? `${p.label}擋住了去路。` : '那邊是一堵牆。','warn');
    sfx('nope');
    draw(); renderUI();
    return;
  }
  S.x = nx; S.y = ny;
  sfx('step');
  endTurn();
}

function attackZombie(z){
  const w = S.weapon ? ITEM[S.weapon.id] : null;
  const base = w ? w.atk : 2;
  const crit = Math.random() < 0.12;
  const dmg = Math.round(base * (crit ? 1.6 : 1));
  z.hp -= dmg;
  if (S.weapon){
    S.weapon.dur -= 1;
    if (S.weapon.dur <= 0){
      say(`${w.name}徹底散架了。`,'bad');
      S.weapon = null;
    }
  }
  if (crit) say(`重擊！${w ? w.name : '拳頭'}砍進${z.name}的脖子，造成 ${dmg} 點傷害。`,'good');
  else say(`你揮${w ? w.name : '出拳頭'}，對${z.name}造成 ${dmg} 點傷害。`,'info');
  sfx('hit');
  alertNear(S.x, S.y, 4);
  if (z.hp <= 0) killZombie(z);
  else z.alerted = true, z.memory = 14;
}

function killZombie(z){
  S.kills++;
  S.zombies = S.zombies.filter(q => q !== z);
  S.corpses.push({ x:z.x, y:z.y, tint: z.type === 'brute' ? '#6a5a48' : z.type === 'boss' ? '#6a4058' : '#55704a' });
  say(`${z.name}倒下了。`,'good');
  sfx('kill');
  if (Math.random() < .42){
    const drops = [
      { id:'scrap', w:3 }, { id:'cloth', w:3 }, { id:'can', w:2 },
      { id:'tape', w:2 }, { id:'bread', w:2 }, { id:'bandage', w:1 },
    ];
    let total = 0; for (const d of drops) total += d.w;
    let r = Math.random() * total, got = drops[0];
    for (const d of drops){ r -= d.w; if (r <= 0){ got = d; break; } }
    if (addItem(got.id, 1)) say(`屍體上還能用的東西：${ITEM[got.id].name} ×1。`,'info');
  }
}

function doWait(){
  if (!S || !S.started || !alive() || modalOpen) return;
  say('你屏住呼吸，等了一拍。','info');
  endTurn();
}

function facingProp(){
  return propAt(S.x + S.dir.x, S.y + S.dir.y) || propAt(S.x, S.y);
}

function nearWorkbench(){
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
    const p = propAt(S.x + dx, S.y + dy);
    if (p && p.kind === 'workbench') return true;
  }
  return false;
}

function interact(){
  if (!S || !S.started || !alive() || modalOpen) return;
  if (nearWorkbench()){ openCraft(); return; }
  if (nearStash()){ openStash(); return; }
  const p = facingProp();
  if (p && p.searchable){ searchContainer(p); return; }
  if (terrAt(S.x + S.dir.x, S.y + S.dir.y) === T.BARRICADE){
    const bx = S.x + S.dir.x, by = S.y + S.dir.y;
    if (!hasItem('crowbar')){
      say('鐵鏈纏得死死的。你需要一根撬棍。','warn');
      sfx('nope');
      return;
    }
    MAP.terr[by*W+bx] = T.DOOR;
    S.changes.push({ x:bx, y:by, t:T.DOOR });
    say('你用撬棍撬斷了鐵鏈，警局的門開了。','good');
    sfx('unlock');
    alertNear(bx, by, 9);
    endTurn();
    return;
  }
  say('這裡沒有可以翻找的東西。','info');
  sfx('nope');
}

function searchContainer(p){
  if (p.searched && !p.locked){ say(`${p.label}已經空了。`,'info'); sfx('nope'); return; }
  if (p.locked){
    if (!hasItem('crowbar')){ say(`${p.label}被鐵鏈纏住 —— 需要撬棍。`,'warn'); sfx('nope'); return; }
    p.locked = null;
    say(`你用撬棍撬開了${p.label}。`,'good');
    sfx('unlock');
    alertNear(p.x, p.y, 8);
  }
  const gained = [];
  for (const e of p.loot){
    if (e.n <= 0) continue;
    const got = addItem(e.id, e.n);
    if (got > 0){ gained.push({ id:e.id, n:got }); e.n -= got; }
  }
  p.loot = p.loot.filter(e => e.n > 0);
  if (p.bp){ learn(p.bp); p.bp = null; }
  if (p.loot.length === 0) p.searched = true;
  if (gained.length) say(`在${p.label}裡找到：${gained.map(g => ITEM[g.id].name + '×' + g.n).join('、')}。`,'good');
  else say(`${p.label}裡剩下的東西背包塞不下了。`,'warn');
  if (gained.length) sfx('pickup');
  S.searches++;
  alertNear(p.x, p.y, 7);
  endTurn();
}

function learn(bp){
  if (S.bp[bp]) return;
  S.bp[bp] = true;
  say(`獲得圖紙：${BPNAME[bp]}。回工作臺就能製作。`,'good');
  sfx('craft');
}

/* =========================================================================
   8. 製作
   ========================================================================= */
function canCraft(r){
  if (r.bp && !S.bp[r.bp]) return { ok:false, why:`需要圖紙：${BPNAME[r.bp]}（${r.bpHint}）` };
  if (r.out === 'radio' && S.radioBuilt) return { ok:false, why:'已經有一臺了' };
  for (const k in r.cost) if (countOf(k) < r.cost[k]) return { ok:false, why:'材料不足' };
  if (r.repair){
    if (!S.weapon && !S.armor) return { ok:false, why:'沒有可以修補的裝備' };
    const wFull = !S.weapon || S.weapon.dur >= ITEM[S.weapon.id].dur;
    const aFull = !S.armor || S.armor.dur >= ITEM[S.armor.id].dur;
    if (wFull && aFull) return { ok:false, why:'裝備狀態良好' };
    return { ok:true };
  }
  if (!hasSpaceFor(r.out)) return { ok:false, why:'背包已滿' };
  return { ok:true };
}

function craftRecipe(id){
  const r = RECIPES.find(x => x.id === id);
  if (!r) return;
  const chk = canCraft(r);
  if (!chk.ok){ say(chk.why,'warn'); sfx('nope'); return; }
  for (const k in r.cost) removeItem(k, r.cost[k]);
  if (r.repair){
    if (S.weapon) S.weapon.dur = ITEM[S.weapon.id].dur;
    if (S.armor) S.armor.dur = ITEM[S.armor.id].dur;
    say('你把武器和護甲都補好了。','good');
    sfx('craft');
  } else {
    addItem(r.out, r.n || 1);
    S.crafted++;
    if (r.out === 'radio'){
      S.radioBuilt = true;
      say('訊號發射器組裝完成。所有喪屍都會聽見它。','good');
      say('在工作臺按下「啟動訊號」，然後守住 10 回合。','warn');
    } else {
      say(`做好了${ITEM[r.out].name}。`,'good');
    }
    sfx('craft');
  }
  refresh();
  if (modalOpen) renderCraft();
  saveGame(true);
}

function startHoldout(){
  if (!S || !S.radioBuilt || S.phase !== 'explore') return;
  S.phase = 'holdout';
  S.holdoutStart = S.turn;
  closeModal();
  /* 訊號招來屍潮：安全屋四面牆被撞開六個缺口 */
  for (const [bx,by] of [[3,10],[9,10],[4,1],[6,1],[8,1],[12,5]]){
    MAP.terr[by*W+bx] = T.DOOR;
    S.changes.push({ x:bx, y:by, t:T.DOOR });
    MAP.breaches.add(by*W+bx);
    const mg = MAP.mini.getContext('2d');
    mg.fillStyle = '#0b0c0e';
    mg.fillRect(bx, by, 1, 1);
  }
  say('你按下開關。電流聲之後，天線亮起。','sys');
  say('整片街區的喪屍同時抬起頭 —— 它們都知道你在哪了。','bad');
  say('四面牆被撞開六個缺口。它們從破口灌進來。','bad');
  say(`守住 ${HOLDOUT_TURNS} 回合，救援就會到。`,'warn');
  for (let i = 0; i < 4; i++){
    const type = i === 0 ? 'brute' : i === 2 ? 'spitter' : i === 3 ? 'crawler' : 'walker';
    const z = spawnAt(holdoutSpawnTile(), type);
    if (z){ z.speed = i === 0 ? 2 : 1; z.atk += 2; z.frenzy = true; }
  }
  alertNear(S.x, S.y, 60);
  sfx('alarm');
  refresh();
  saveGame(true);
}

/* =========================================================================
   9. 回合與喪屍 AI
   ========================================================================= */
function endTurn(){
  if (!S || S.phase === 'dead' || S.phase === 'won') return;
  S.turn++;
  zombiesAct();
  if (S.hp <= 0){ die(); return; }
  waves();
  if (S.phase === 'holdout' && S.turn - S.holdoutStart >= HOLDOUT_TURNS){ win(); return; }
  refresh();
  saveGame(true);
}

function zombiesAct(){
  for (const z of S.zombies){
    if (S.hp <= 0) break;
    z.cd--;
    if (z.cd > 0) continue;
    z.cd = z.speed;
    zombieThink(z);
  }
  S.zombies = S.zombies.filter(z => z.hp > 0);
}

function zombieThink(z){
  const dist = Math.abs(S.x - z.x) + Math.abs(S.y - z.y);
  const playerSafe = S.phase !== 'holdout' && inSafehouse(S.x, S.y);
  if (!z.alerted && dist <= z.sense && lineClear(z.x, z.y, S.x, S.y)){
    z.alerted = true;
    z.memory = 16;
  }
  if (!z.alerted && S.phase === 'holdout' && dist < 26){
    z.alerted = true;
    z.memory = 99;
  }
  if (z.alerted){
    z.memory--;
    if (z.range && !playerSafe && dist <= z.range && lineClear(z.x, z.y, S.x, S.y)){
      hitPlayer(z, true);
    } else if (dist === 1){
      hitPlayer(z);
    } else {
      const door = ZMAP.safehouse.door;
      const tx = playerSafe ? door[0] : S.x;
      const ty = playerSafe ? door[1] + 1 : S.y;
      if (!(z.x === tx && z.y === ty)){
        const step = nextStep(z.x, z.y, tx, ty);
        if (step){
          const nx = z.x + step[0], ny = z.y + step[1];
          if (!zombieAt(nx, ny)){ z.x = nx; z.y = ny; }
        } else {
          greedyStep(z);
        }
      }
    }
    if (z.memory <= 0 && dist > z.sense) z.alerted = false;
  } else if (Math.random() < .20){
    const [dx, dy] = pick(DIRS);
    const nx = z.x + dx, ny = z.y + dy;
    if (!zombieBlocked(nx, ny) && !zombieAt(nx, ny) &&
        Math.abs(nx - z.home.x) + Math.abs(ny - z.home.y) <= 3){
      z.x = nx; z.y = ny;
    }
  }
}

function hitPlayer(z, ranged){
  const def = S.armor ? ITEM[S.armor.id].def : 0;
  const dmg = Math.max(1, z.atk - (ranged ? Math.floor(def / 2) : def));
  S.hp -= dmg;
  say(ranged ? `${z.name}噴出的酸液濺到你身上 —${dmg} 生命。` : `${z.name}撕中了你的手臂 —${dmg} 生命。`, 'bad');
  sfx('hurt');
  if (S.armor){
    S.armor.dur--;
    if (S.armor.dur <= 0){
      say(`${ITEM[S.armor.id].name}被扯爛了。`,'bad');
      S.armor = null;
    }
  }
  alertNear(S.x, S.y, 6);
}

function alertNear(x, y, r){
  for (const z of S.zombies){
    if (Math.hypot(z.x - x, z.y - y) <= r){
      z.alerted = true;
      z.memory = Math.max(z.memory, 15);
    }
  }
}

function lineClear(x0, y0, x1, y1){
  if (Math.abs(x1-x0) + Math.abs(y1-y0) > 14) return false;
  let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy, x = x0, y = y0;
  for (let guard = 0; guard < 64; guard++){
    if (!(x === x0 && y === y0)){
      const t = MAP.terr[y*W+x];
      if (t === T.WALL || t === T.BARRICADE) return false;
      const p = MAP.props.get(y*W+x);
      if (p && p.block) return false;
    }
    if (x === x1 && y === y1) return true;
    const e2 = 2 * err;
    if (e2 > -dy){ err -= dy; x += sx; }
    if (e2 < dx){ err += dx; y += sy; }
  }
  return false;
}

const bfsQ = new Int32Array(W * H);
const bfsPrev = new Int32Array(W * H);
const bfsMark = new Int32Array(W * H);
let bfsStamp = 0;

function nextStep(sx, sy, tx, ty){
  if (sx === tx && sy === ty) return null;
  if (Math.abs(tx-sx) + Math.abs(ty-sy) > 70) return null;
  bfsStamp++;
  const occ = new Set();
  for (const z of S.zombies) occ.add(z.y*W + z.x);
  const start = sy*W + sx, goal = ty*W + tx;
  let head = 0, tail = 0;
  bfsQ[tail++] = start;
  bfsMark[start] = bfsStamp;
  bfsPrev[start] = -1;
  while (head < tail){
    const cur = bfsQ[head++];
    if (cur === goal){
      let n = cur;
      while (bfsPrev[n] !== -1 && bfsPrev[n] !== start) n = bfsPrev[n];
      if (bfsPrev[n] === -1) return null;
      return [n % W - sx, ((n / W) | 0) - sy];
    }
    if (head > 2400) break;
    const cx = cur % W, cy = (cur / W) | 0;
    for (const [dx, dy] of DIRS){
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const ni = ny*W + nx;
      if (bfsMark[ni] === bfsStamp) continue;
      if (ni !== goal){
        if (zombieBlocked(nx, ny)) continue;
        if (occ.has(ni)) continue;
      }
      bfsMark[ni] = bfsStamp;
      bfsPrev[ni] = cur;
      bfsQ[tail++] = ni;
      if (tail >= W*H) break;
    }
  }
  return null;
}

function greedyStep(z){
  const dx = Math.sign(S.x - z.x), dy = Math.sign(S.y - z.y);
  const tries = Math.abs(S.x - z.x) >= Math.abs(S.y - z.y)
    ? [[dx,0],[0,dy]] : [[0,dy],[dx,0]];
  for (const [sx, sy] of tries){
    if (!sx && !sy) continue;
    const nx = z.x + sx, ny = z.y + sy;
    if (!zombieBlocked(nx, ny) && !zombieAt(nx, ny)){ z.x = nx; z.y = ny; return; }
  }
}

function farStreetTile(minDist){
  const cands = MAP.spawnTiles.filter(([x,y]) =>
    Math.abs(x - S.x) + Math.abs(y - S.y) >= minDist &&
    !blocked(x,y) && !zombieAt(x,y));
  return cands.length ? pick(cands) : null;
}

function nearStreetTile(minDist, maxDist){
  const cands = MAP.spawnTiles.filter(([x,y]) => {
    const d = Math.abs(x - S.x) + Math.abs(y - S.y);
    return d >= minDist && d <= maxDist && !blocked(x,y) && !zombieAt(x,y);
  });
  return cands.length ? pick(cands) : farStreetTile(minDist);
}

/* 堅守時它們從六個破口與大門灌進來：出生點都在缺口內外 */
const HOLDOUT_SPOTS = [
  [3,9],[4,9],[5,9],[6,9],[7,9],[8,9],[9,9],
  [3,11],[9,11],[6,11],[6,12],
  [4,2],[6,2],[8,2],[4,0],[6,0],[8,0],
  [11,5],[13,5],[13,7],
];
function holdoutSpawnTile(){
  const cands = HOLDOUT_SPOTS.filter(([x,y]) =>
    !blocked(x,y) && !zombieAt(x,y) &&
    Math.abs(x - S.x) + Math.abs(y - S.y) >= 3);
  return cands.length ? pick(cands) : farStreetTile(4);
}

function spawnAt(tile, type){
  if (!tile) return null;
  return spawnZombie(type, tile[0], tile[1]);
}

function waves(){
  if (S.phase === 'holdout'){
    const left = HOLDOUT_TURNS - (S.turn - S.holdoutStart);
    if (left <= 0) return;
    if (S.zombies.length < 40){
      for (let i = 0; i < 5; i++){
        const type = (i === 2 && left % 2 === 0) ? 'spitter' : (Math.random() < .22 ? 'crawler' : 'walker');
        const z = spawnAt(holdoutSpawnTile(), type);
        if (z){ z.speed = 1; z.atk += 2; z.frenzy = true; }
      }
      if (left % 3 === 0){
        const zb = spawnAt(holdoutSpawnTile(), 'brute');
        if (zb){ zb.speed = 2; zb.atk += 2; zb.frenzy = true; }
      }
      if (left === 4){
        const zz = spawnAt(holdoutSpawnTile(), 'boss');
        if (zz){ zz.speed = 1; zz.atk += 2; zz.frenzy = true; }
      }
    }
  } else if (S.turn > 0 && S.turn % 14 === 0 && S.zombies.length < 22){
    spawnAt(farStreetTile(13), Math.random() < .3 ? 'crawler' : 'walker');
    say('遠處傳來拖曳的腳步聲 —— 有東西被聲音引來了。','warn');
  }
}

      ? `<i class="durbar"><b style="width:${clamp(s.dur / d.dur, 0, 1) * 100}%"></b></i>` : '';

function computeHint(){
  if (!S.started) return { text:'準備好了就點「進入廢墟」。', alert:false };
  if (S.phase === 'dead') return { text:'你倒下了。點「重新開始」再來一次。', alert:true };
  if (S.phase === 'won') return { text:'你活下來了。直升機的旋翼聲蓋過整條街。', alert:false };
  if (S.phase === 'holdout'){
    const left = Math.max(0, HOLDOUT_TURNS - (S.turn - S.holdoutStart));
    return { text:`堅守！救援還有 ${left} 回合 —— 守住門口，別讓它們圍住你。`, alert:true };
  }
  if (inSafehouse(S.x, S.y) && S.zombies.some(z => !inSafehouse(z.x, z.y) &&
      Math.abs(z.x - S.x) + Math.abs(z.y - S.y) <= 4)){
    return { text:'牠們在門外徘徊 —— 啟動訊號之前，安全屋是安全的。', alert:false };
  }
  if (nearStash()) return { text:'按 E 打開儲物櫃：把多餘的零件存起來，擴建可增加格數。', alert:false };
  if (nearWorkbench()) return { text:'按 E 打開工作臺：武器、護甲、急救包、訊號發射器。', alert:false };
  const p = facingProp();
  if (p && p.searchable){
    if (p.locked) return { text: hasItem('crowbar') ? `按 E 用撬棍撬開${p.label}。` : `${p.label}鎖著 —— 需要一根撬棍。`, alert:true };
    return { text: p.searched ? `${p.label}已經被翻空了。` : `按 E 搜索${p.label}。`, alert:false };
  }
  if (terrAt(S.x + S.dir.x, S.y + S.dir.y) === T.BARRICADE){
    return { text: hasItem('crowbar') ? '按 E 用撬棍撬斷鐵鏈。' : '大門被鐵鏈鎖死 —— 需要撬棍。', alert:true };
  }
  if (S.radioBuilt) return { text:'訊號發射器已就緒 —— 回安全屋工作臺啟動它。', alert:false };
  return { text:'WASD 移動（撞向喪屍即攻擊） · E 搜索 · F 進食 · 空格等待', alert:false };
}

function recipeRow(r){
  const locked = !!(r.bp && !S.bp[r.bp]);
  const chk = canCraft(r);
  const out = r.repair ? { color:'#8a9aa8', glyph:'修' } : ITEM[r.out];
  const name = locked ? '？？？' : (r.repair ? '修補裝備' : ITEM[r.out].name);
  const why = (!chk.ok && !locked && chk.why !== '材料不足')
    ? `<span class="badge">${chk.why}</span>` : '';
  const cost = Object.entries(r.cost).map(([id, n]) => {
    const have = countOf(id);
    return `<span class="${have >= n ? 'c-ok' : 'c-no'}">${ITEM[id].name} ${have}/${n}</span>`;
  }).join(' · ');
  return `<div class="recipe ${chk.ok ? '' : 'locked'}">
    <div class="r-icon" style="color:${out.color}">${locked ? '?' : out.glyph}</div>
    <div>
      <div class="r-name">${name} <span class="tag">${r.note}</span>${locked ? `<span class="badge">圖紙：${r.bpHint}</span>` : why}</div>
      <div class="r-cost">${cost}</div>
      <div class="r-desc">${r.desc}</div>
    </div>
    <button class="btn r-btn" data-act="craft" data-id="${r.id}" ${chk.ok ? '' : 'disabled'}>製作</button>
  </div>`;
}

  openModal(`<div class="modal-card">
    <div class="mc-head">
      <div><h2>工作臺</h2><p>安全屋 · 把廢墟裡的零件變成活命的東西</p></div>
      <button class="mc-x" data-act="close">×</button>
    </div>
    <div class="recipes">${rows}</div>
    ${canStart ? `<div class="warnbox">
      <p><b>訊號發射器已就緒。</b>啟動後整片街區的喪屍都會朝安全屋聚集 —— 你要在門口守住 ${HOLDOUT_TURNS} 回合。</p>
      <button class="btn danger" data-act="start">啟動訊號</button>
    </div>` : ''}
    ${hold ? `<p style="margin-top:14px;color:#e0b25a;font-size:12px">訊號已經發出。堅守 ${Math.max(0, HOLDOUT_TURNS - (S.turn - S.holdoutStart))} 回合。</p>` : ''}
  </div>`, false);
}

function openCraft(){
  if (!S || !S.started || !alive()) return;
  ensureAudio();
  renderCraft();
  sfx('equip');
}

function showGameOver(won){
  const stats = `<div class="statgrid">
    <div class="stat"><b>${S.turn}</b><span>存活回合</span></div>
    <div class="stat"><b>${S.kills}</b><span>擊殺喪屍</span></div>
    <div class="stat"><b>${S.crafted}</b><span>製作裝備</span></div>
  </div>`;
  openModal(`<div class="modal-card"><div class="over">
    <div class="big" style="color:${won ? '#83c46c' : '#d96655'}">${won ? '✓' : '✕'}</div>
    <h2>${won ? '直升機來了' : '你倒下了'}</h2>
    <p>${won ? `${S.name}，救援隊把你從這片街區帶走。城市還在燃燒，但你活著。` : `${S.name}，第 ${S.turn} 回合，你在安全屋附近失去了意識。`}</p>
    ${stats}
    <button class="btn primary" data-act="restart">重新開始</button>
  </div></div>`, true);
}

function restart(){
  const name = S ? S.name : PLAYER_NAME;
  closeModal();
  modalLock = false;
  newGame(false, name);
  say('你重新睜開眼睛。街區還是老樣子。','sys');
  refresh();
  saveGame(true);
  canvas.focus();
}

/* =========================================================================
   12. 輸入
   ========================================================================= */
window.addEventListener('keydown', (e) => {
  ensureAudio();
  if (modalOpen){
    if (e.key === 'Escape' && !modalLock) closeModal();
    return;
  }
  if (!S || !S.started) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w'){ e.preventDefault(); tryMove(0,-1); }
  else if (k === 'arrowdown' || k === 's'){ e.preventDefault(); tryMove(0,1); }
  else if (k === 'arrowleft' || k === 'a'){ e.preventDefault(); tryMove(-1,0); }
  else if (k === 'arrowright' || k === 'd'){ e.preventDefault(); tryMove(1,0); }
  else if (k === 'e'){ interact(); }
  else if (k === ' '){ e.preventDefault(); doWait(); }
  else if (k === 'f'){ eatBest(); }
  else if (k === '?' || k === 'h'){ showHelp(); }
});

canvas.addEventListener('click', (e) => {
  ensureAudio();
  if (!S || !S.started || modalOpen || !alive()) return;
  const r = canvas.getBoundingClientRect();
  const sx = (e.clientX - r.left) / r.width * VIEW_W;
  const sy = (e.clientY - r.top) / r.height * VIEW_H;
  /* 點在小地圖上不要當成走路 */
  if (sx > VIEW_W - 150 && sy < 110) return;
  const x = Math.floor((sx + CAM.x) / TILE);
  const y = Math.floor((sy + CAM.y) / TILE);
  if (x === S.x && y === S.y){ interact(); return; }
  if (Math.abs(x - S.x) + Math.abs(y - S.y) === 1) tryMove(x - S.x, y - S.y);
  canvas.focus();
});

$('bagGrid').addEventListener('click', (e) => {
  const drop = e.target.closest('[data-drop]');
  if (drop){ e.stopPropagation(); dropItem(+drop.dataset.drop); return; }
  const slot = e.target.closest('[data-bag]');
  if (slot) useBag(+slot.dataset.bag);
});

$('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal' && !modalLock){ closeModal(); return; }
  const bagSlot = e.target.closest('[data-stash-bag]');
  if (bagSlot){ bagToStash(+bagSlot.dataset.stashBag, e.shiftKey); return; }
  const stashSlot = e.target.closest('[data-stash-item]');
  if (stashSlot){ stashToBag(+stashSlot.dataset.stashItem, e.shiftKey); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  ensureAudio();
  if (act === 'close') closeModal();
  else if (act === 'startgame'){
    const inp = $('nameInput');
    beginRun(inp ? inp.value : '阿鐵');
  }
  else if (act === 'continue'){
    const d = loadSave();
    if (d) continueGame(d);
    else showIntroModal();
  }
  else if (act === 'craft') craftRecipe(btn.dataset.id);
  else if (act === 'start') startHoldout();
  else if (act === 'restart') restart();
  else if (act === 'help') showHelp();
  else if (act === 'stash-deposit-all') depositAllMaterials();
  else if (act === 'stash-withdraw-all') withdrawAll();
  else if (act === 'stash-upgrade') upgradeStash();
});

$('helpBtn').addEventListener('click', () => { ensureAudio(); showHelp(); });
$('saveBtn').addEventListener('click', () => {
  ensureAudio();
  if (!S || !S.started) return;
  if (saveGame(false)){ sfx('pickup'); }
  renderUI();
});
$('muteBtn').addEventListener('click', () => {
  MUTED = !MUTED;
  S.muted = MUTED;
  $('muteBtn').classList.toggle('off', MUTED);
  $('muteBtn').title = MUTED ? '音效已關閉' : '音效開關';
  if (!MUTED) { ensureAudio(); sfx('pickup'); }
});
$('musicBtn').addEventListener('click', () => {
  MUSIC_ON = !MUSIC_ON;
  $('musicBtn').classList.toggle('off', !MUSIC_ON);
  $('musicBtn').title = MUSIC_ON ? '背景音樂已開啟' : '背景音樂已關閉';
  ensureAudio();
  if (musicBus && AC){
    musicBus.gain.cancelScheduledValues(AC.currentTime);
    musicBus.gain.setTargetAtTime(MUSIC_ON ? .5 : 0, AC.currentTime, .25);
  }
});

/* =========================================================================
   13. 啟動 + 調試接口
   ========================================================================= */
newGame(true);

window.addEventListener('beforeunload', () => { saveGame(true); });

window.__G = {
  get S(){ return S; },
  get MAP(){ return MAP; },
  T, ITEM, RECIPES, ZOMBIES, DIRS, HOLDOUT_TURNS, CAP, W, H, VIEW_W, VIEW_H, CAM, ZONES,
  newGame, refresh, draw, renderUI, updateCamera,
  tryMove, doWait, interact, interactAt: null,
  craftRecipe, canCraft, startHoldout, eatBest, useBag, dropItem,
  addItem, removeItem, countOf, hasItem, say, learn,
  saveGame, loadSave, clearSave, continueGame, beginRun, sanitizeName, SAVE_KEY,
  stashCap, stashCount, addToStash, bagToStash, stashToBag, depositAllMaterials,
  withdrawAll, upgradeStash, renderStash, openStash, nearStash, STASH_CAPS,
  nextStep, blocked, propAt, terrAt, zombieAt, zoneAt,
  searchContainer, openCraft, showHelp, closeModal,
  teleport(x,y){ S.x = x; S.y = y; refresh(); },
  spawnZombie, endTurn,
  music(){ return { on: MUSIC_ON, timer: !!musicTimer, bus: !!musicBus, drone: droneOn }; },
  stats(){
    return {
      turn:S.turn, hp:S.hp, phase:S.phase, kills:S.kills, crafted:S.crafted,
      bag:S.bag.map(b => ({ id:b.id, n:b.n, dur:b.dur })),
      weapon:S.weapon, armor:S.armor, x:S.x, y:S.y,
      zombies:S.zombies.length, radioBuilt:S.radioBuilt,
      bp:Object.keys(S.bp), holdoutStart:S.holdoutStart,
    };
  },
};

})();
</script>
</body>
</html>
